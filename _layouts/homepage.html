<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
{% include head.html %}
  <body>
    <nav class="topnav">
      <div class="topnav-inner">
        <a class="topnav-brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <button class="topnav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="topnav-links">
          <i class="fas fa-bars"></i>
          <i class="fas fa-times"></i>
        </button>
        <div class="topnav-links" id="topnav-links">
          <a href="#about">About</a>
          <a href="#news">News</a>
          <a href="#publications">Publications</a>
          <a href="#teaching-experience">Teaching</a>
          <a href="#service">Service</a>
          <a href="#awards">Awards</a>
        </div>
      </div>
    </nav>
    <div class="wrapper">
      {% include sidebar.html %}
      <section>

      {{ content }}

      <br>

      {% if site.enable_footnote %}
      <p><small>Powered by Jekyll and <a href="https://github.com/yaoyao-liu/minimal-light" target="_blank" rel="noopener">Minimal Light</a> theme.</small></p>
      {% endif %}

      </section>
      <footer>
        
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
    <script src="{{ "/assets/js/nav.js" | relative_url }}"></script>
    <script src="{{ "/assets/js/external-links.js" | relative_url }}"></script>
    {% if site.google_analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google_analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
  </body>
</html>
